<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="profileos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Blue Squircle Icon Container -->
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#profileos-bg)" />
  
  <!-- Outer Concentric White Ring -->
  <circle cx="28" cy="28" r="16" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.95" />
  
  <!-- Inner Concentric White Ring -->
  <circle cx="28" cy="28" r="9.5" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.95" />
  
  <!-- Center White Disc -->
  <circle cx="28" cy="28" r="3.5" fill="#FFFFFF" />

  <!-- Brand Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">
    <text x="66" y="38" fill="#0F172A" letter-spacing="-0.03em">Profile</text>
    <text x="160" y="38" fill="#F97316" letter-spacing="-0.03em">OS</text>
  </g>
</svg>
