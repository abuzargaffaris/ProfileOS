    <script>
      // Single Page Application clean URL unpacker from 404.html
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get('p');
          if (redirect) {
            params.delete('p');
            var cleanRoute = decodeURIComponent(redirect).replace(/^\/+/, '');
            var basePath = window.location.pathname.replace(/\/$/, '');
            var newSearch = params.toString() ? '?' + params.toString() : '';
            var target = (cleanRoute ? basePath + '/' + cleanRoute : basePath + '/') + newSearch + window.location.hash;
            window.history.replaceState(null, '', target);
          }
        } catch (e) {}
      })();
    </script>
